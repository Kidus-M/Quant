[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-backtester"
version = "0.1.0"
description = "Research backtesting engine for intraday XAU/USD. Measures expectancy after costs."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.1",
    "pyarrow>=18",
    "matplotlib>=3.9",
    "PyYAML>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
