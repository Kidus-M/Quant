# Backtest-wide configuration. Nothing here should be duplicated as a constant in code.

account:
  initial_capital_usd: 50.0
  currency: USD

instrument:
  symbol: XAUUSD
  # Standard spot gold contract. 1 lot = 100 troy ounces, so 0.01 lots = 1 oz.
  contract_size_oz_per_lot: 100.0
  min_lot: 0.01
  lot_step: 0.01

data:
  base_resolution: 1min      # the ONLY resolution ever written to the cache as source
  resolution: 15min          # resolution the backtest runs on (resampled from base)
  start: "2019-01-01"
  end: "2024-12-31"
  adapter: twelvedata        # synthetic | csv | parquet | twelvedata | oanda | dukascopy
  cache_dir: data/cache
  quarantine_dir: data/quarantine

  # Adapter-specific settings. Only the section for data.adapter is read.
  synthetic:
    seed: 7
    start_price: 1800.0
    annual_vol: 0.15
    annual_drift: 0.0
  csv:
    path: data/raw
    source_timezone: UTC     # stated, never guessed
    timestamp_column: null
    timestamp_format: null
  twelvedata:
    # A data vendor, not a broker: a free key is issued on signup with no
    # residency check, which is why this exists alongside oanda. It publishes no
    # bid/ask and no volume for metals, so the cost model's spread stays an
    # assumption and every bar carries volume 0.0. See src/data/twelvedata.py.
    #
    # Bars per request. The API caps a response at 5000 rows and TRUNCATES a
    # longer window silently, so this stays below the cap with room to spare.
    chunk_bars: 4000
    # Free ("basic") plan allows 8 requests/minute and 800/day. Requests are
    # spaced to fit. Raise this only if the plan actually changed.
    requests_per_minute: 8
  oanda:
    # practice | live. A practice token will not authenticate against the live
    # host, so this and the token in .env must agree.
    environment: practice
    # BA fetches separate bid and ask candles, which yields a measured `spread`
    # column alongside the mid OHLC. Set to M only if you are content for the
    # cost model's spread to remain an assumption.
    price: BA
  dukascopy:
    # NOTE (2026-09): the free Dukascopy datafeed now answers 429 for every
    # symbol and date, and 503 behind a browser User-Agent. The adapter is kept
    # because the decoder is correct and tested, but the source is unavailable.
    max_workers: 8

  quality:
    sigma_threshold: 12.0    # flag a bar whose close moves > N sigma vs prior bars
    sigma_window: 500
    # Structural failures (duplicates, non-positive prices, high<low, bars stamped
    # outside session hours) are always dropped and written to quarantine.
    drop_outside_session: true
    # Suspicious-but-plausible bars are kept by default. Gold really does gap on a
    # CPI print, and deleting the bars that hurt is the most flattering thing a
    # backtester can do to itself. Flip these only with a reason.
    quarantine_zero_volume: false
    quarantine_price_spikes: false
    max_flagged_fraction: 0.02   # abort the load if more than this fraction is dropped
    # Separate budget for bars dropped as outside market hours, and only for a
    # source that declares it pads non-trading hours (currently twelvedata, which
    # fills Saturday and most of Sunday with forward-filled rows). For every other
    # adapter an out-of-session bar still counts against max_flagged_fraction
    # above, because there it usually means the timestamps are in the wrong
    # timezone. Gold is shut roughly 47 of 168 hours a week, so a correct load
    # from a padding source drops a little under 30%; the headroom here covers
    # holidays. Raise it only after checking the bars really are stamped UTC.
    max_outside_session_fraction: 0.45

macro:
  enabled: true
  source: fred
  series: [DFII10, DTWEXBGS, DGS10, T10YIE]
  # Published values are lagged before being joined to intraday bars, then
  # forward-filled only. One business day is the minimum defensible lag.
  publication_lag_days: 1
  cache_dir: data/cache/fred

# The market calendar. Gold trades roughly Sun 22:00 UTC -> Fri 21:00 UTC with a
# short daily break. Resampling must not invent bars across these gaps.
session:
  week_open_weekday: 6       # Sunday
  week_open_time_utc: "22:00"
  week_close_weekday: 4      # Friday
  week_close_time_utc: "21:00"
  daily_break_start_utc: "21:00"
  daily_break_end_utc: "22:00"
  rollover_hour_utc: 21      # financing is charged on positions held past this

costs:
  # Pessimistic by default. Every one of these makes results worse, never better.
  spread_usd_per_oz_round_trip: 0.30
  slippage_usd_per_oz_per_side: 0.10
  commission_usd_per_lot_per_side: 0.0
  # Financing on positions held past the rollover hour, USD per oz per night.
  # Negative = a charge. Long gold normally pays.
  swap_long_usd_per_oz_per_night: -0.15
  swap_short_usd_per_oz_per_night: 0.05
  # Spreads blow out overnight and around news. Multiplier applied to the spread
  # only (not slippage) by UTC hour-of-day. Hours not listed use 1.0.
  spread_session_multipliers:
    "22": 2.5
    "23": 2.5
    "0": 2.0
    "1": 2.0
    "2": 1.8
    "3": 1.8
    "4": 1.8
    "5": 1.5
    "20": 1.5
    "21": 3.0
  # Extra multiplier applied in a window around scheduled news timestamps
  # supplied to the cost model (empty by default).
  news_spread_multiplier: 3.0
  news_window_minutes: 15

sizing:
  mode: fixed              # fixed | vol_target | fixed_fractional
  fixed_lots: 0.01
  # vol_target mode
  target_daily_vol_fraction: 0.01   # 1% of equity per day of P&L volatility
  vol_lookback_bars: 96
  # fixed_fractional mode
  risk_fraction_per_trade: 0.01     # 1% of equity per stop-out
  stop_atr_multiple: 2.0
  atr_period: 14
  # Loud warning threshold: % of equity at risk per 1 ATR of adverse movement.
  risk_per_atr_warning_pct: 5.0

execution:
  # A signal generated on bar t fills at bar t+1 open, plus slippage, always
  # against the trade. This is not configurable -- it is enforced in the engine.
  fill: next_bar_open

walk_forward:
  enabled: true
  mode: anchored           # anchored: in-sample window always starts at the beginning
  in_sample_days: 365
  out_of_sample_days: 90
  min_in_sample_days: 365
  # Bars dropped either side of a train/test boundary. Default (null) resolves to
  # the strategy's maximum indicator lookback.
  embargo_bars: null

random_benchmark:
  n_runs: 1000
  seed: 20240101
  percentile_threshold: 95

reporting:
  output_dir: reports
  write_trade_log: true
  write_plots: true
